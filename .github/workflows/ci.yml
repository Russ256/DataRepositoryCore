name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore DataRepositoryCore.slnx

      - name: Build
        run: dotnet build DataRepositoryCore.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DataRepositoryCore.slnx --configuration Release --no-build

      - name: Verify NuGet packages
        shell: pwsh
        run: ./PackageSmokeTest/run.ps1
